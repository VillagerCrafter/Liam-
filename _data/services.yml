- title: Brand activations & ambassadors
  summary: Turn a live moment into a real conversation with the right people and a thoughtful experience.
  description: From the first guest interaction to the last photo of the day, I help bring brand activations to life with confident ambassador representation, audience engagement, and practical on-site support.
  example: On the Sargento Cheese Wheeler tour, I supported a branded mobile activation built around a welcoming, hands-on guest experience.
  image: /assets/images/sargento-tour.jpg
  alt: Liam and the activation team at a Sargento Cheese Wheeler tour stop
- title: Tour management & field operations
  summary: Keep people, details, and moving parts on track from one stop to the next.
  description: Tour work calls for clear communication, reliable logistics, and a steady presence on the ground. I have helped organize and produce tours, coordinate activation setups, and share detailed reports so teams can keep improving from stop to stop.
  example: My tour experience includes Sargento and Samson's Grapes programs, with activation setup, reporting, and on-the-ground coordination.
  image: /assets/images/samsons-tour.jpg
  alt: Liam at a Samson's Grapes tour stop
- title: Hosting & emceeing
  summary: Give the room a warm welcome, keep the energy moving, and make guests feel part of it.
  description: I host live experiences with an engaging, audience-first style. That can mean welcoming guests, leading interactive moments, introducing activities, and keeping a multi-part event feeling connected.
  example: As lead host at Minneapolis' Smirnoff-sponsored Nightmare Bar, I hosted more than 3,000 guests across October while guiding guests through the event's interactive stations.
  image: /assets/images/nightmare-host.jpg
  alt: Liam hosting guests at the Nightmare Bar in a striped suit
- title: Video, photography & social content
  summary: Capture the energy on site and turn it into content that travels beyond the event.
  description: I create photography and video that show the people, details, and feeling of an activation - from SEMA booth spotlights and convention-floor interviews to event recaps. Content can support social campaigns, creator collaborations, and future promotion.
  example: My event footage has been featured by KARE 11 and WAVE, and I coordinated promotional video work for Super Troopers 3.
  image: /assets/images/super-troopers.jpg
  alt: Super Troopers 3 promotional event at WWE SummerSlam
- title: Creator & influencer campaigns
  summary: Bring the right voices into the campaign and make the collaboration feel natural.
  description: I help shape creator outreach and on-site coordination so the brand, the talent, and the audience have a clear reason to connect. Campaign scope and deliverables are tailored to the project.
  example: For Super Troopers 3, I worked with creators including the Haroon Twins and Amour Kiki, whose audiences collectively reach millions of followers.
  image: /assets/images/super-troopers.jpg
  alt: Super Troopers 3 promotional event at WWE SummerSlam
- title: Digital & social campaigns
  summary: Carry the energy of an in-person experience into the channels your audience follows.
  description: I connect live activations with digital touchpoints through social-first content, campaign coordination, and creator collaborations. Each idea is designed around the audience and the action the brand wants people to take.
  example: My event work has been featured by KARE 11 and WAVE, and I have coordinated creator promotion for Super Troopers 3.
  image: /assets/images/coca-cola-kickoff.jpg
  alt: Liam at a Coca-Cola and Big Ten event
- title: Creative marketing & consulting
  summary: Find a practical, original answer to the marketing challenge in front of you.
  description: Bring me the problem, not a pre-made brief. I take a consultative approach to identify opportunities, connect the right services, and build a creative plan that fits your brand, audience, and resources.
  example: My work across brand representation, hosting, tour operations, and content production gives me a grounded perspective on what can work both on paper and on event day.
  image: /assets/images/toyota-special-olympics.jpg
  alt: Liam speaking with a guest at a Toyota activation
